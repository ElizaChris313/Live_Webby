<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound</title>
    <link rel="stylesheet" href="styles.css">
</head>
<script src="//code.jquery.com/jquery.min.js"></script>
<script> 
    $(function(){
      $("#header").load("header.html"); 
      $("#footer").load("footer.html"); 
    });
</script> 
<body>
    <div id="header"></div>

    <!-- SOUND GALLERY -->
    <div class="tunes-container" id="tunes-container">
        <!-- Sound players will be generated by JavaScript -->
    </div>

    <script>
        let soundExperienceData = null;
        let soundData = null;

        // Load the sound data
        fetch('sound_data.json')
            .then(response => response.json())
            .then(data => {
                soundData = data;
                renderSoundPlayers();
            })
            .catch(error => {
                console.error('Error loading sound data:', error);
                // Fallback to hardcoded data if JSON fails to load
                soundData = {
                    "sounds": [
                        {
                            "id": 1,
                            "title": "DJ_Kricket's_Hospital.wav",
                            "artist": "chris-liz",
                            "coverArt": "coverArt/UVGP.jpeg",
                            "src": "Sounds/Hospital V2.wav",
                            "category": "🎵 Electronic",
                            "year": "2024",
                            "alt": "pixel art rendering of chris-liz in a green suit"
                        },
                        {
                            "id": 2,
                            "title": "generic_funky_club music.wav",
                            "artist": "chris-liz",
                            "coverArt": "pixel-cl.png",
                            "src": "Sounds/Simple Club Song.wav",
                            "category": "🎵 Club",
                            "year": "2024",
                            "alt": "pixel art rendering of chris-liz in a green suit"
                        },
                        {
                            "id": 3,
                            "title": "Pickle Entertainment System Startup",
                            "artist": "chris-liz",
                            "coverArt": "pixel-cl.png",
                            "src": "Sounds/Hospital V2.wav",
                            "category": "🎵 Experimental",
                            "year": "2024",
                            "alt": "pixel art rendering of chris-liz in a green suit"
                        },
                        {
                            "id": 4,
                            "title": "drip.wav",
                            "artist": "chris-liz",
                            "coverArt": "pixel-cl.png",
                            "src": "Sounds/Hospital V2.wav",
                            "category": "🎵 Ambient",
                            "year": "2024",
                            "alt": "pixel art rendering of chris-liz in a green suit"
                        }
                    ]
                };
                renderSoundPlayers();
            });

        function renderSoundPlayers() {
            if (!soundData) return;
            
            const container = document.getElementById('tunes-container');
            
            // Generate HTML for all sound players
            container.innerHTML = soundData.sounds.map(item => {
                return `
                    <div class="player">
                        <div class="player-header">
                            <div class="box-container">
                                <div class="small-green-box"></div>
                                <div class="small-green-box"></div>
                                <div class="small-green-box"></div>
                            </div>
                        </div>
                        <img src="${item.coverArt}" alt="${item.alt}">
                        <div class="player-track-meta">
                            <p>${item.title}</p>
                            <p><span>${item.artist}</span></p>
                        </div>
                        <div class="player-controls">
                            <button class="player-play-btn" 
                                role="button" 
                                aria-label="Play"
                                data-playing="false">
                                <div class="player-icon-play">
                                    <img src="/UI/Media001.png" alt="Play Icon">
                                </div>
                                <div class="player-icon-pause hidden">
                                    <img src="/UI/Alert008.png" alt="Pause Icon">
                                </div>
                            </button>
                            <div class="player-timeline">
                                <span class="player-time player-time-current">00:00</span>
                                <div class="player-progress">
                                    <div class="player-progress-filled"></div>
                                </div>
                                <span class="player-time player-time-duration">00:00</span>
                            </div>
                            <div class="player-volume-container">
                                <input type="range" min="0" max="1" value="1" step="0.01" class="player-volume" />
                            </div>
                        </div>
                        <audio src="${item.src}" crossorigin="anonymous" preload="metadata"></audio>
                    </div>
                `;
            }).join('');
            
            // IMPORTANT: Dispatch an event to let app.js know new players were added
            // This triggers the audio initialization in app.js
            document.dispatchEvent(new Event('playersAdded'));
        }
    </script>
    
    <script src="app.js"></script>
</body>
</html>
