<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
 <link rel="stylesheet" href="styles.css">
</head>
<script src="//code.jquery.com/jquery.min.js"></script>
<script> 
    $(function(){
      $("#header").load("header.html"); 
      $("#footer").load("footer.html"); 
    });
</script> 
<body>
    <div id="header"></div>

    <!-- MUSIC gallery -->
   <div class="gallery-container" id="gallery-container">
    <!-- Gallery items will be generated by JavaScript -->
</div>

<script src="LX_galleryData"></script>
<script>

    let experienceData = null;
    
    // First load experience data
    fetch('experience.json')
        .then(response => response.json())
        .then(data => {
            experienceData = data;
            // Then create your gallery using galleryData.js
            renderGallery();
        })
        .catch(error => console.error('Error loading experience data:', error));
    
    // Your existing renderGallery function, modified:
    function createGalleryItem(item) {
        // Find matching experience
        const exp = experienceData ? 
            experienceData.experience.find(e => e.id === item.id) : null;
        
        return `
        <div class="gallery">
            <div class="gallery-header">
                <p>${item.category}</p>
                <div class="box-container">
                    <div class="small-green-box"></div>
                    <div class="small-green-box"></div>
                    <div class="small-green-box"></div>
                </div>
            </div>
            <img src="${item.image}" alt="${item.alt}">
            <div class="gallery-track-meta">
                <p><strong>${exp ? exp.show : item.title}</strong></p>
                <p>${exp ? exp.role : ''}</p>
                <p>${exp ? exp.producingCompany : ''}</p>
                <p><span>${exp ? exp.venue : item.venue}</span></p>
            </div>
        </div>
        `;
    }
    
    function renderGallery() {
        if (!experienceData) return;
        
        const container = document.getElementById('gallery-container');
        container.innerHTML = galleryData.map(item => createGalleryItem(item)).join('');
    }
</script>
    
    <script src="app.js"></script>
</body>
</html>
